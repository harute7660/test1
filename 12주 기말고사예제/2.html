<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>text-shadow와 box-shadow</title>
<style>
h2 {
    text-shadow: 2px 2px 3px blue;
    color: yellow;
}
img {
    width: 100px;
    height: 70px;
}
img:hover {
    box-shadow: 0px 0px 5px blue;
}
</style>
</head>
<body>
<h2>Most Visited Pages</h2>
<hr>
<table>
<tr>
    <td><img src="naver.png"></td>
    <td><img src="amazon.png"></td>
</tr>
</table>
</body>
</html>
