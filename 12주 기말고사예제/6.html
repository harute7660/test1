<title>float 배치</title>

#floatimg {

    margin: 10px;
    padding: 5px;
    border: 1px solid yellowgreen;
}
</style>
</head>
<body>
<h3>진주조개</h3>
<hr>
<div>
    <img id="floatimg" src="pearl.png" width="100" height="100">
    <p><br>저는 진주입니다. 여의주를 껍데기 속에 소중하게 보관해주고 있는 든든한 친구이자 조력자인 진주조개입니다.</p>
</div>
</body>
</html>
