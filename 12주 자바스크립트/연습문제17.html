<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>원기둥 부피 계산</title>
</head>
<body>
    <script>
        let radius = Number(prompt("원기둥 밑면의 반지름을 입력하세요"));
        let height = Number(prompt("원기둥의 높이를 입력하세요"));

        let volume = Math.PI * radius * radius * height;

        alert("원기둥의 부피는 " + volume.toFixed(2) + "입니다.");
    </script>
</body>
</html>
