<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>책 객체 만들기</title>
</head>
<body>
    <script>
        let book = {
            "이름": "C# 프로그래밍(2판)",
            "초판 발행": "2021년 1월 5일",
            "지은이": "윤인성",
            "펴낸이": "전태호",
            "펴낸곳": "한빛아카데미(주)",
            "책임편집": "김성무",
            "기획": "김성무",
            "편집": "정서린",
            "디자인": "최연희, 이아란"

        document.write("이름: " + book["이름"] + "<br>");
        document.write("초판 발행: " + book["초판 발행"] + "<br>");
        document.write("지은이: " + book["지은이"] + "<br>");

        document.write("기획: " + book["기획"] + "<br>");
        document.write("편집: " + book["편집"] + "<br>");
        document.write("디자인: " + book["디자인"] + "<br>");
    </script>
</body>
</html>
