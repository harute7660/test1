<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시계 만들기</title>

    <script>
        window.onload = function () {
            // clock이라는 id를 가진 태그 선택
            var clock = document.getElementById('clock');

            // 몇 번 실행됐는지 세는 변수
            var cnt = 0;

            // 1초마다 함수 실행
            var timer = setInterval(function () {
                cnt++;

                // 현재 시간 객체 생성
                var now = new Date();

                // 화면에 현재 시간 출력
                clock.innerHTML = now.toString();

                // 5번 실행되면 타이머 종료
                if (cnt == 5) {
                    clearInterval(timer);
                }
            }, 1000);
        };
    </script>
</head>
<body>
    <h1 id="clock"></h1>
</body>
</html>
