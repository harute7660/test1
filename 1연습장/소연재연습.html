<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그 셀렉터 만들기</title>
    <style>
        h3 {color : blue; text-align:right;}

        span {background-color:skyblue;color:blue;} *  {background-color:linen; color:blueviolet;}

        .bottom {
            position:fixed;
            bottom:0;
            left:0;
            height:50px;
            width:100%;
            background:navy;
        }

        .button {
            width:150px;
            height:70px;
            background-color:orange;
            border:1px solid white;
            border-radius:30px;
            box-shadow:5px 5px 5px lightgray;
        }
    </style>
</head>
<body>
    <h3>소연재</h3>
    <hr>
    <p>저는 체조 선수 소연재입니다. 
        <span>음악</span>을 들으면서 책읽기를 좋아합니다.
        <span>김치 찌개와 </span><span>막국수</span>무척 좋아합니다.</p>
    </p>

    <div class="bottom">소연재</div>
    <div class="button"><span><a>CLick</a></span></div>
</body>
</html>
