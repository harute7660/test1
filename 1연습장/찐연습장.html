<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {overflow:hidden;}

        li {
            float:left;
            padding:15px;
            list-style:none;
        }

        li:first-child {border-radius:20px 0 0 20px;}
        li:last-child {border-radius:0 20px 20px 0;}
        li:nth-child(2n) {background-color:orange;}
        li:nth-child(2n+1) {background-color:blue;}

        .bottom {
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:50px;
            background:navy;
        }
    </style>
</head>
<body>
    <h3>지건</h3>
    <hr>
    <form>
        <fieldset>
            <legend>Login</legend>
            <label for="username">username</label>
            <input type="text" id="username">
            <label for="Password">password</label>
            <input type="password" id="password">
        </fieldset>
    </form>

    <ul>
        <li>1</li>
        <li>1</li>
        <li>1</li>
        <li>1</li>
        <li>1</li>
        <li>1</li>
        <li>1</li>
    </ul>
</body>
</html>
