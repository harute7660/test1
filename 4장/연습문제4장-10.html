<!DOCTYPE html>
<html>
<head>
    <title>10번문제</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <form>
        <fieldset>
            <b>시작 그룹</b><br>
            <input type="radio" name="startgroup" id="startgroup_first">
            <label for="startgroup_first">새 탭 페이지 열기</label><br>

            <input type="radio" name="startgroup" id="startgroup_second">
            <label for="startgroup_second">중단한 위치에서 계속하기</label><br>

            <input type="radio" name="startgroup" id="startgroup_third">
            <label for="startgroup_third">특정 페이지 또는 페이지 모음 열기</label><br>
            <br>

            <b>개인정보 및 보안</b><br>
            <input type="checkbox" id="information_first">
            <label for="information_first">동기화 및 서비스</label><br>

            <input type="checkbox" id="information_second">
            <label for="information_second">로그인 허용</label><br>

            <input type="checkbox" id="information_third">
            <label for="information_third">페이지 미리 로드</label>
        </fieldset>
    </form>
</body>
</html>
