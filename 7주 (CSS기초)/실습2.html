<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 꾸미기</title>
</head>
<style>
    p {
        text-indent: 1em;
        background : aliceblue;
        color: brown;
        font-family: "Lucida Console",sans-serif;
        font-size: 25px;
    }
    span {
        font-size: 1.5em;
        text-decoration: underline;
}
</style>
<body>
    <h3>텍스트와 폰트</h3>
    <hr>
    <p>AliceBlue바탕색에 Brown 색의 "LucidaConsole"폰트로 10px크기이고 <span>저는 이보다 1.5배 큽니다.</span></p>
</body>
</html>
