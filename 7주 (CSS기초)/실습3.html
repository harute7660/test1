<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Table</title>
    <style>
        div {
            width: 80px;
            height: 30px;
        }
    </style>
</head>
<body>
    <table border="1">
        <tr>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
        </tr>
        <tr>
            <td>Brown</td>
            <td>#A52A2A</td>
            <td><div style="background:#A52A2A"></div></td>
            <td>BlueViolet</td>
            <td>#8A2BE2</td>
            <td><div style="background:#8A2BE2"></div></td>
        </tr>
        <tr>
            <td>DarkOrange</td>
            <td>#FF8C00</td>
            <td><div style="background:#FF8C00"></div></td>
            <td>DeepSkyBlue</td>
            <td>#00BFFF</td>
            <td><div style="background:#00BFFF"></div></td>
        </tr>
        <tr>
            <td>Gold</td>
            <td>#FFD700</td>
            <td><div style="background:#FFD700"></div></td>
            <td>OliveDrab</td>
            <td>#6B8E23</td>
            <td><div style="background:#6B8E23"></div></td>
        </tr>
    </table>
</body>
</html>
